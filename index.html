<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 确保移动端视口正常缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视频播放</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 响应式视频容器 */
    .video-wrapper {
      width: 100%;
      height: 100%;
      max-width: 1200px; /* 电脑端最大宽度 */
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px; /* 手机端留少许边距，防止贴边 */
    }

    .video-container {
      width: 100%;
      /* 保持标准的 16:9 视频比例 */
      aspect-ratio: 16 / 9;
      position: relative;
      background: #111;
      border-radius: 8px; /* 稍微带点圆角提升 UI 质感 */
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 针对手机等竖屏设备的适配：如果屏幕太狭长，保证视频不溢出 */
    @media (max-aspect-ratio: 16/9) {
      .video-container {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <div class="video-container">
      <iframe 
        src="https://drive.google.com/file/d/1sAQ1ACj1_hBCR0ithWX5v20hzsVE7M7Z/preview" 
        allow="autoplay; encrypted-media; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
